name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate tag and derive installer path
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"

          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedTag'."
          }

          $installerPath = "release/DesktopPet-Setup-$version-x64.exe"
          "INSTALLER_PATH=$installerPath" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:INSTALLER_PATH -PathType Leaf)) {
            throw "Expected installer was not created: $env:INSTALLER_PATH"
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create `
            "$env:GITHUB_REF_NAME" `
            "$env:INSTALLER_PATH" `
            --verify-tag `
            --generate-notes `
            --title "$env:GITHUB_REF_NAME"
